name: Build and release XKeen UI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example v1.0.0 or v1.0.0-beta.1)"
        required: true
        type: string
      prerelease:
        description: "Publish as beta instead of latest"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      beta: ${{ steps.version.outputs.beta }}
    steps:
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${INPUT_VERSION:-$REF_NAME}"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* || "$PRERELEASE" == true ]]; then
            echo "beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "beta=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Build frontend
        working-directory: frontend
        run: bun install --frozen-lockfile && bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist

  test:
    uses: ./.github/workflows/check.yml

  build:
    needs: [prepare, frontend, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: arm64-v8a
          - target: mipsel-unknown-linux-musl
            name: mips32le
            rustflags: "-C target-feature=+crt-static -L /usr/local/mipsel-linux-muslsf/lib -L /usr/local/lib/gcc/mipsel-linux-muslsf/9.2.0"
          - target: mips-unknown-linux-musl
            name: mips32
            rustflags: "-C target-feature=+crt-static -L /usr/local/mips-linux-muslsf/lib -L /usr/local/lib/gcc/mips-linux-muslsf/9.2.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: sed -i "s/^version = .*/version = \"${RELEASE_VERSION#v}\"/" backend/Cargo.toml
      - run: rustup toolchain install nightly --profile minimal -c rust-src
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.target }}
      - name: Install cross
        run: type cross || cargo install cross --git https://github.com/cross-rs/cross --locked
      - name: Embed frontend for cross
        working-directory: backend
        run: |
          cp -r ../frontend/dist ./dist
          sed -i 's|\.\./frontend/dist|./dist|' src/frontend_embedder.rs
      - name: Build binary
        working-directory: backend
        env:
          XKEEN_UI_REPOSITORY: ${{ github.repository }}
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          cross +nightly build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/xkeen-ui ../xkeen-ui-${{ matrix.name }}
      - uses: actions/upload-artifact@v7
        with:
          name: xkeen-ui-${{ matrix.name }}
          path: xkeen-ui-${{ matrix.name }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: xkeen-ui-*
          merge-multiple: true
          path: artifacts
      - name: Create checksums
        working-directory: artifacts
        run: sha256sum xkeen-ui-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.beta == 'true' }}
          generate_release_notes: true
          files: |
            artifacts/xkeen-ui-*
            artifacts/SHA256SUMS
            setup.sh
